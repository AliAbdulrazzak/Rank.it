# Project-wide Gradle settings.

# Increase JVM heap size to fix OutOfMemoryError during build
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle daemon
org.gradle.daemon=true

# Enable parallel builds
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# Enable configuration caching (speeds up repeated builds)
org.gradle.configuration-cache=false

# AndroidX settings
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enable R8 full mode for smaller APKs (release builds)
android.enableR8.fullMode=false
